# clipmill settings and streamers. Committed to the repo, so NO secrets in here.
# Keys go in config.toml on your Mac (git-ignored) or in GitHub secrets for cloud runs.

[paths]
work_dir = "work"          # downloaded windows, transcripts (safe to delete)
output_dir = "output"      # rendered clips
db = "clipmill.db"         # cloud runs set CLIPMILL_DB=state/clipmill.db

[detect]
bucket_seconds = 5          # chat is counted in 5 second buckets
baseline_minutes = 10       # rolling window used as "normal" chat speed
min_zscore = 3.0            # how far above normal a spike must be
min_gap_seconds = 90        # spikes closer than this are merged
max_candidates_per_vod = 12 # only the strongest spikes go to the judge (keeps cloud minutes free)
lead_seconds = 50           # chat reacts after the moment, so look back this far
tail_seconds = 15
viewer_clip_boost = 2.0     # extra score when a viewer already clipped that moment
vods_per_streamer = 2       # how many recent VODs to look at each run

[judge]
mode = "claude"             # "claude" uses claude -p on your plan; "heuristic" needs no LLM
claude_bin = "claude"
model = "haiku"             # smallest model; plenty for reading a transcript. "sonnet" if picks look weak
min_score = 6               # 1 to 10, clips below this are not rendered at all

[transcribe]
model = "base"              # faster-whisper: tiny, base, small. base is fast on cloud CPUs
device = "auto"
compute_type = "auto"

[render]
disclosure = "#ad"          # shown for the first 3 seconds; Content Rewards requires it at the start
disclosure_seconds = 3
width = 1080
height = 1920
crf = 20
preset = "veryfast"
font = "Arial Black"
caption_words = 3

[auto]
review = false              # false: clips scoring min_score+ post themselves, no review needed
                            # true:  every clip goes to Telegram with Post / Skip buttons first
min_score = 7               # judge score needed to post automatically
max_uploads_per_run = 2
max_uploads_per_day = 6     # across all streamers, so the channel never floods
platforms = ["youtube", "instagram"]   # a platform with no login set up is skipped

[youtube]
client_secrets = "client_secret.json"
token_file = "youtube_token.json"
privacy = "public"          # forced to private by Google until the API audit passes
category_id = "20"          # Gaming
default_tags = ["GTA 6", "GTA VI", "GTA", "gaming", "shorts"]

[contentrewards]
# Submit each post to its streamer's campaign right after it goes public (30-minute rule).
submit = true
# YouTube is left out until Google's audit lets uploads be public (private posts are rejected).
platforms = ["instagram"]
state_file = "cr_state.json"

[instagram]
api_host = "https://graph.facebook.com"
user_id = "17841470543539884"   # @gta6momentsclips2026
api_version = "v23.0"
share_to_feed = true

