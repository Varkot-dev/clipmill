[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipmill"
version = "0.1.0"
description = "Turns Twitch streams into captioned vertical clips for review and upload"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "requests",
    "yt-dlp",
    "faster-whisper",
    "google-api-python-client",
    "google-auth-oauthlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
clipmill = "clipmill.cli:main"

[tool.setuptools]
packages = ["clipmill"]
