# Finds new VODs, makes clips, and sends them to your phone (Telegram) for review.
# Runs on GitHub's servers; your computer can be off.
name: make clips

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      max_vods:
        description: "VODs to process this run"
        default: "3"
      vod:
        description: "Only this VOD id (optional)"
        default: ""

permissions:
  contents: write   # save the database to the state branch
  actions: read

concurrency:
  group: clipmill-state   # never run at the same time as the approvals job
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
      CLIPMILL_DB: state/clipmill.db
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Load saved state
        run: bash scripts/load_state.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null

      - name: Install TwitchDownloaderCLI
        run: |
          gh release download -R lay295/TwitchDownloader -p '*CLI*Linux-x64.zip' -D /tmp/tdl
          unzip -q -o /tmp/tdl/*.zip -d /tmp/tdl
          sudo install -m 755 /tmp/tdl/TwitchDownloaderCLI /usr/local/bin/TwitchDownloaderCLI

      - name: Install Claude Code (judge)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code > /dev/null

      - name: Install clipmill
        run: pip install -q -e .

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-v1

      - name: Make clips and send them for review
        run: |
          args="--max-vods ${{ inputs.max_vods || '3' }}"
          if [ -n "${{ inputs.vod }}" ]; then args="$args --vod ${{ inputs.vod }}"; fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then export CLIPMILL_JUDGE_MODE=heuristic; fi
          python -m clipmill.cli --config none run $args

      - name: Keep the clips for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Save state
        if: always()
        run: bash scripts/save_state.sh
