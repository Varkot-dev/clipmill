# Picks up your Post / Skip taps from Telegram and posts approved clips to YouTube and Instagram.
# A light job (about a minute) so it can run often without using much of the free allowance.
name: approvals

on:
  schedule:
    - cron: "7 * * * *"   # hourly
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # download clip artifacts from earlier runs

concurrency:
  group: clipmill-state
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      CLIPMILL_DB: state/clipmill.db
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Load saved state
        run: bash scripts/load_state.sh

      # Cheap check (a few seconds) so most hourly runs end before installing anything.
      - name: Skip if there is nothing to do
        id: gate
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ ! -f state/clipmill.db ]; then
            echo "Telegram not set up or no clips yet; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          waiting=$(sqlite3 state/clipmill.db "SELECT COUNT(*) FROM clips WHERE status='approved' OR (status='pending' AND notified_message_id IS NULL)")
          offset=$(sqlite3 state/clipmill.db "SELECT value FROM kv WHERE key='telegram_offset'" || true)
          taps=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?timeout=0${offset:+&offset=$offset}" \
            | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('result', [])))")
          echo "clips waiting to post or send: $waiting, new Telegram taps: $taps"
          if [ "$waiting" = "0" ] && [ "$taps" = "0" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install clipmill (light)
        if: steps.gate.outputs.skip != 'true'
        run: pip install -q --no-deps -e . && pip install -q numpy requests google-api-python-client google-auth-oauthlib

      - name: Apply taps and post approved clips
        if: steps.gate.outputs.skip != 'true'
        run: python -m clipmill.cli --config none approvals

      - name: Save state
        if: always() && steps.gate.outputs.skip != 'true'
        run: bash scripts/save_state.sh
